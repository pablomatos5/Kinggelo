# King Gelo (kinggelo.com.br): site + painel, projeto independente que so divide esta VPS.
# Vai em /opt/sites-extra/conf/ (o nginx do Nexos inclui conf/*.conf). App em /opt/kinggelo (container kinggelo-app,
# na rede nexos_default so para este nginx alcanca-lo).
# Certificado em /opt/sites-extra/certs (renovado pelo cron semanal do root, webroot /opt/sites-extra/acme).

server {
    listen 80;
    server_name kinggelo.com.br www.kinggelo.com.br;

    location /.well-known/acme-challenge/ {
        root /etc/nginx/sites-extra/acme;
    }

    location / {
        return 301 https://kinggelo.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.kinggelo.com.br;

    ssl_certificate     /etc/nginx/sites-extra/certs/live/kinggelo.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/sites-extra/certs/live/kinggelo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://kinggelo.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kinggelo.com.br;

    ssl_certificate     /etc/nginx/sites-extra/certs/live/kinggelo.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/sites-extra/certs/live/kinggelo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS, CSP e compressao ja vem do proprio app (KG_HTTPS=1)
    client_max_body_size 1m;

    location / {
        # variavel + resolver (definido no nginx.conf principal): recriar o container do app nao deixa o nginx
        # preso ao IP antigo (502).
        set $kinggelo_app http://kinggelo-app:8090;
        proxy_pass $kinggelo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # sobrescreve, nunca anexa: o cliente nao planta IP falso no limite de tentativas de login
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
