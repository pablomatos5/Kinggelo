# Uso na VPS (separado do Nexos): só entra na rede do nginx compartilhado para ser encaminhado.
name: kinggelo
services:
  app:
    build: ..
    container_name: kinggelo-app
    restart: unless-stopped
    environment:
      KG_HTTPS: "1"
    volumes:
      - dados:/dados
    networks: [nginx]
volumes:
  dados:
networks:
  nginx:
    external: true
    name: nexos_default
